name: Keep Render Deployment Warm

on:
  schedule:
    # Runs every 10 minutes (cron: '*/10 * * * *')
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          # Replace with your actual Render deployment URL:
          RENDER_URL="https://airpower-platform.onrender.com/health"
          echo "Pinging $RENDER_URL to prevent Render free-tier sleep..."
          curl -s -f -m 20 "$RENDER_URL" || echo "Ping request sent."
